<style>
  :root {
    --fg: #1a1a1a;
    --muted: #666;
    --rule: #c7c7c7;
    --rule-strong: #8a8a8a;
    --surface: #f6f7f9;
    --code-bg: #eef0f3;
    --link: #264478;
    --th-bg: #e9ecef;
    --base: 10pt;
    --sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }
  body {
    font-family: var(--sans);
    font-size: var(--base);
    line-height: 1.45;
    color: var(--fg);
    margin: 0.6in;
  }
  h1, h2, h3, h4 { font-weight: 600; line-height: 1.2; }
  h1 { font-size: 1.5em;  margin: 0 0 6pt 0; }
  h2 { font-size: 1.2em;  margin: 14pt 0 4pt 0; padding-bottom: 2pt; border-bottom: 0.5px solid var(--rule-strong); }
  h3 { font-size: 1.05em; margin: 8pt 0 3pt 0; color: var(--fg); }
  h4 { font-size: 1em;    margin: 6pt 0 2pt 0; color: var(--muted); }
  p  { margin: 3pt 0; }

  /* Lists share the body size and leading. */
  ul, ol { margin: 3pt 0; padding-left: 18pt; }
  li { margin: 1pt 0; }

  /* Code — inline + diagram blocks share one monospace family. */
  code, kbd, samp {
    font-family: var(--mono);
    font-size: 0.9em;
    background: var(--code-bg);
    padding: 0 3px;
    border-radius: 2px;
  }
  pre {
    font-family: var(--mono);
    font-size: 0.88em;
    line-height: 1.35;
    background: var(--surface);
    border: 0.5px solid var(--rule);
    border-left: 2px solid var(--rule-strong);
    border-radius: 3px;
    padding: 8px 12px;
    margin: 6pt 0;
    overflow-x: auto;
    page-break-inside: avoid;
  }
  pre code {
    background: transparent;
    padding: 0;
    border-radius: 0;
    font-size: inherit;
  }

  /* Tables — one size, consistent padding, zebra rows. */
  table {
    border-collapse: collapse;
    width: 100%;
    font-size: 0.88em;
    margin: 6pt 0;
  }
  th, td {
    border: 0.5px solid var(--rule);
    padding: 4px 6px;
    text-align: left;
    vertical-align: top;
    line-height: 1.35;
  }
  th { background: var(--th-bg); font-weight: 600; }
  tbody tr:nth-child(even) td { background: #fafbfc; }

  /* Figures */
  .diagram-container {
    page-break-inside: avoid;
    text-align: center;
    margin: 6pt 0;
  }
  .diagram-container img, .diagram-container svg {
    max-width: 100%;
    height: auto;
    max-height: 320px;
    object-fit: contain;
  }
  .figure-caption {
    font-size: 0.82em;
    color: var(--muted);
    margin: 2pt 0 6pt 0;
  }

  a { color: var(--link); }
  strong { font-weight: 600; }

  @media print {
    body { margin: 0.5in; }
  }
</style>
