<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrL3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000"/>
    </marker>
    <style><![CDATA[
      .box { fill: #fff; stroke: #000; stroke-width: 0.9; }
      .gate { fill: #fff; stroke: #000; stroke-width: 1; }
      .term { fill: #000; stroke: #000; stroke-width: 1; }
      .lbl-c { font-size: 11px; fill: #000; text-anchor: middle; }
      .lbl   { font-size: 10.5px; fill: #000; }
      .lbl-b { font-size: 10.5px; fill: #000; font-style: italic; text-decoration: underline; }
      .lbl-i-c { font-size: 9.5px; fill: #000; font-style: italic; text-anchor: middle; }
      .lbl-i   { font-size: 9.5px; fill: #000; font-style: italic; }
      .h  { font-size: 11px; font-weight: 600; fill: #000; }
      .edge { stroke: #000; stroke-width: 0.9; fill: none; }
      .title { font-size: 13px; font-weight: 600; fill: #000; text-anchor: middle; }
      .mono { font-family: "SF Mono", Menlo, Consolas, "Courier New", monospace; font-size: 10px; fill: #000; }
      .flow { font-size: 11px; fill: #000; text-anchor: middle; }
      .flow-k { font-size: 11px; font-weight: 700; fill: #000; }
      .proto { font-weight: 700; }
      .lane { fill: #fff; stroke: #000; stroke-width: 0.5; stroke-dasharray: 2 2; }
    ]]></style>
  </defs>

  <text x="380" y="18" class="title">Figure 2 · L3 — Internal Clusters</text>

  <!-- ================ CLUSTER A : AGENT (readable flow) ================ -->
  <g transform="translate(20,34)">
    <rect x="0" y="0" width="720" height="210" class="box"/>
    <text x="8" y="16" class="h">A · Primary Agent — what happens inside one turn</text>

    <!-- lane labels -->
    <line x1="0" y1="30" x2="720" y2="30" stroke="#000" stroke-width="0.3" stroke-dasharray="2 2"/>
    <text x="10" y="46" class="lbl-i">1. in</text>
    <text x="10" y="90" class="lbl-i">2. loop</text>
    <text x="10" y="150" class="lbl-i">3. gate</text>
    <text x="10" y="196" class="lbl-i">4. out</text>

    <!-- step 1: user in -->
    <rect x="60" y="34" width="130" height="36" class="box"/>
    <text x="125" y="52" class="lbl-c">User message in</text>
    <text x="125" y="64" class="lbl-i-c">via a role-checked route</text>

    <line x1="190" y1="52" x2="218" y2="52" class="edge" marker-end="url(#arrL3)"/>

    <!-- step 2a: agent reasons -->
    <rect x="220" y="34" width="150" height="36" class="box"/>
    <text x="295" y="52" class="lbl-c">Agent reasons</text>
    <text x="295" y="64" class="lbl-i-c">LLM step · chatbot node</text>

    <!-- decision -->
    <polygon points="400,52 430,30 540,30 570,52 540,74 430,74" class="gate"/>
    <text x="485" y="50" class="lbl-c">Needs a tool?</text>
    <text x="485" y="64" class="lbl-i-c">should_continue?</text>

    <line x1="370" y1="52" x2="398" y2="52" class="edge" marker-end="url(#arrL3)"/>

    <!-- step 2b: run tool -->
    <rect x="600" y="34" width="110" height="36" class="box"/>
    <text x="655" y="52" class="lbl-c">Run tool</text>
    <text x="655" y="64" class="lbl-i-c">tool_node</text>

    <line x1="570" y1="52" x2="598" y2="52" class="edge" marker-end="url(#arrL3)"/>
    <text x="585" y="46" class="lbl-i">yes</text>

    <!-- loop back from tool to reason -->
    <path d="M 655 70 L 655 100 L 295 100 L 295 70" class="edge" marker-end="url(#arrL3)"/>
    <text x="475" y="96" class="lbl-i-c">tool_call → agent reasons again (bounded loop, max N steps)</text>

    <!-- HITL gate (branch off Run tool before it fires) -->
    <polygon points="600,138 630,118 710,118 740,138 710,158 630,158" class="gate"/>
    <text x="670" y="136" class="lbl-c">Risky?</text>
    <text x="670" y="150" class="lbl-i-c">HITL interrupt</text>

    <path d="M 655 70 L 655 118" class="edge" marker-end="url(#arrL3)"/>
    <text x="663" y="94" class="lbl-i">tap</text>

    <rect x="420" y="124" width="150" height="36" class="box"/>
    <text x="495" y="142" class="lbl-c">Reviewer approves</text>
    <text x="495" y="154" class="lbl-i-c">queue · Dash UI · logged</text>
    <line x1="600" y1="138" x2="572" y2="138" class="edge" marker-end="url(#arrL3)"/>

    <!-- no path -> straight to respond -->
    <text x="485" y="92" class="lbl-i">no</text>
    <path d="M 485 74 L 485 190" class="edge" marker-end="url(#arrL3)"/>

    <!-- step 4: respond -->
    <rect x="60" y="178" width="150" height="26" class="box"/>
    <text x="135" y="196" class="lbl-c">Response + citations</text>

    <rect x="230" y="178" width="150" height="26" class="box"/>
    <text x="305" y="196" class="lbl-c">AgentAction recorded</text>

    <circle cx="440" cy="191" r="12" class="term"/>
    <text x="440" y="195" class="lbl-c" fill="#fff">END</text>

    <line x1="210" y1="191" x2="228" y2="191" class="edge" marker-end="url(#arrL3)"/>
    <line x1="380" y1="191" x2="427" y2="191" class="edge" marker-end="url(#arrL3)"/>

    <!-- edge from "approve" back to respond -->
    <path d="M 495 160 L 495 191 L 382 191" class="edge" marker-end="url(#arrL3)"/>
  </g>

  <!-- ================ CLUSTER B : TOOL REGISTRY ================ -->
  <g transform="translate(20,258)">
    <rect x="0" y="0" width="350" height="140" class="box"/>
    <text x="8" y="16" class="h">B · Tool Registry   <tspan class="proto">⟨I⟩ Tool</tspan></text>
    <text x="8" y="34" class="lbl">examples:</text>
    <text x="8" y="50" class="lbl">documents  — ingest · search · cite</text>
    <text x="8" y="64" class="lbl">query_data — SQL · RBAC-scoped</text>
    <text x="8" y="88" class="mono">POST /tools/execute/&lt;name&gt;</text>
    <text x="8" y="102" class="mono">body: { "args": {...}, "trace_id": ... }</text>
    <text x="8" y="124" class="lbl-i">validated against <tspan class="proto">⟨I⟩ Tool</tspan> · audited · new tool = new class</text>
  </g>

  <!-- ================ CLUSTER C : DATASOURCE ================ -->
  <g transform="translate(390,258)">
    <rect x="0" y="0" width="350" height="140" class="box"/>
    <text x="8" y="16" class="h">C · DataSource Registry   <tspan class="proto">⟨I⟩ DataSource</tspan></text>
    <text x="8" y="34" class="lbl">LocalFile — filesystem (live)</text>
    <text x="8" y="48" class="lbl-b">SharePoint — Graph API [LocalFile mirror]</text>
    <text x="8" y="62" class="lbl-b">SAP — REST / OData [CSV fixtures]</text>
    <text x="8" y="76" class="lbl-b">STK / MATLAB — adapter [reserved]</text>
    <text x="8" y="90" class="lbl-b">Vector index — AI Search [LocalFile]</text>
    <text x="8" y="112" class="lbl-i">per-request · RBAC-scoped · MSAL / OAuth</text>
    <text x="8" y="126" class="lbl-i">response carries doc / page / section + confidence</text>
  </g>

  <!-- ================ CLUSTER D : AUTH text flow ================ -->
  <g transform="translate(20,412)">
    <rect x="0" y="0" width="720" height="52" class="box"/>
    <text x="8" y="16" class="h">D · Auth + RBAC + Trace</text>
    <text x="360" y="34" class="flow">
      <tspan class="flow-k">route</tspan>  →  <tspan class="flow-k">before_request</tspan> (auth · role · trace_id)  →  <tspan class="flow-k">handler</tspan>  →  <tspan class="flow-k">after_request</tspan> (audit emit)  →  <tspan class="flow-k">response</tspan>
    </text>
    <text x="360" y="48" class="lbl-i-c">base(1) &lt; power(2) &lt; admin(3)   ·   role &lt; required → 403   ·   unregistered route → 404 before auth</text>
  </g>
</svg>
