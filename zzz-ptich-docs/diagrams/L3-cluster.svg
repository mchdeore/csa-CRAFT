<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrL3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000"/>
    </marker>
    <style><![CDATA[
      .box { fill: #fff; stroke: #000; stroke-width: 0.9; }
      .gate { fill: #fff; stroke: #000; stroke-width: 1; }
      .term { fill: #000; stroke: #000; stroke-width: 1; }
      .lbl-c { font-size: 11px; fill: #000; text-anchor: middle; }
      .lbl   { font-size: 10.5px; fill: #000; }
      .lbl-b { font-size: 10.5px; fill: #000; font-style: italic; text-decoration: underline; }
      .lbl-i-c { font-size: 9.5px; fill: #000; font-style: italic; text-anchor: middle; }
      .lbl-i   { font-size: 9.5px; fill: #000; font-style: italic; }
      .h  { font-size: 12px; font-weight: 700; fill: #000; }
      .edge { stroke: #000; stroke-width: 0.9; fill: none; }
      .title { font-size: 13px; font-weight: 600; fill: #000; text-anchor: middle; }
      .mono { font-family: "SF Mono", Menlo, Consolas, "Courier New", monospace; font-size: 10px; fill: #000; }
      .flow { font-size: 11px; fill: #000; text-anchor: middle; }
      .flow-k { font-size: 11px; font-weight: 700; fill: #000; }
      .proto { font-weight: 700; }
    ]]></style>
  </defs>

  <text x="380" y="18" class="title">Figure 2 · L3 — Internal Clusters</text>

  <!-- ============== A · Primary Agent ============== -->
  <text x="20" y="42" class="h">A · Primary Agent — what happens inside one turn</text>

  <g transform="translate(0,50)">
    <!-- loop corridor over the top of row 1 -->
    <path d="M 595 24 L 595 8 L 245 8 L 245 24" class="edge" marker-end="url(#arrL3)"/>
    <text x="420" y="4" class="lbl-i-c">tool_call → agent reasons again   (bounded loop, max N steps)</text>

    <!-- row 1: User → Agent → Decision → yes → Run tool -->
    <rect x="20"  y="24" width="130" height="40" class="box"/>
    <text x="85"  y="42" class="lbl-c">User message in</text>
    <text x="85"  y="56" class="lbl-i-c">via a role-checked route</text>

    <rect x="180" y="24" width="130" height="40" class="box"/>
    <text x="245" y="42" class="lbl-c">Agent reasons</text>
    <text x="245" y="56" class="lbl-i-c">LLM step · chatbot node</text>

    <polygon points="340,44 370,20 470,20 500,44 470,68 370,68" class="gate"/>
    <text x="420" y="42" class="lbl-c">Needs a tool?</text>
    <text x="420" y="56" class="lbl-i-c">should_continue?</text>

    <rect x="530" y="24" width="130" height="40" class="box"/>
    <text x="595" y="42" class="lbl-c">Run tool</text>
    <text x="595" y="56" class="lbl-i-c">tool_node</text>

    <line x1="150" y1="44" x2="178" y2="44" class="edge" marker-end="url(#arrL3)"/>
    <line x1="310" y1="44" x2="338" y2="44" class="edge" marker-end="url(#arrL3)"/>
    <line x1="500" y1="44" x2="528" y2="44" class="edge" marker-end="url(#arrL3)"/>
    <text x="513" y="38" class="lbl-i">yes</text>

    <!-- HITL column (stacked on the right) -->
    <polygon points="530,110 560,86 660,86 690,110 660,134 560,134" class="gate"/>
    <text x="610" y="108" class="lbl-c">Risky?</text>
    <text x="610" y="122" class="lbl-i-c">HITL interrupt</text>

    <rect x="530" y="150" width="160" height="46" class="box"/>
    <text x="610" y="168" class="lbl-c">Reviewer approves</text>
    <text x="610" y="184" class="lbl-i-c">queue · Dash UI · logged</text>

    <!-- tap from Run tool down to Risky -->
    <path d="M 595 64 L 595 86" class="edge" marker-end="url(#arrL3)"/>
    <text x="600" y="80" class="lbl-i">tap</text>

    <!-- Risky yes → down to Reviewer -->
    <path d="M 610 134 L 610 150" class="edge" marker-end="url(#arrL3)"/>
    <text x="616" y="146" class="lbl-i">yes</text>

    <!-- row 3: outputs -->
    <rect x="20"  y="236" width="150" height="40" class="box"/>
    <text x="95"  y="256" class="lbl-c">Response + citations</text>
    <text x="95"  y="270" class="lbl-i-c">UMR-002 / 006</text>

    <rect x="200" y="236" width="170" height="40" class="box"/>
    <text x="285" y="256" class="lbl-c">AgentAction recorded</text>
    <text x="285" y="270" class="lbl-i-c">UMR-015 / 027</text>

    <circle cx="420" cy="256" r="14" class="term"/>
    <text x="420" y="260" class="lbl-c" fill="#fff">END</text>

    <line x1="170" y1="256" x2="198" y2="256" class="edge" marker-end="url(#arrL3)"/>
    <line x1="370" y1="256" x2="406" y2="256" class="edge" marker-end="url(#arrL3)"/>

    <!-- "no" from decision: straight down (clear of HITL column), left on y=216 bus to Response -->
    <path d="M 420 68 L 420 216 L 95 216 L 95 236" class="edge" marker-end="url(#arrL3)"/>
    <text x="428" y="100" class="lbl-i">no</text>

    <!-- Risky "no": exit right vertex, go right, down, left on y=226 bus to AgentAction -->
    <path d="M 690 110 L 710 110 L 710 226 L 285 226 L 285 236" class="edge" marker-end="url(#arrL3)"/>
    <text x="697" y="104" class="lbl-i">no</text>

    <!-- Reviewer approve: down to the y=226 bus -->
    <path d="M 610 196 L 610 226" class="edge"/>
    <text x="618" y="214" class="lbl-i">approve</text>
  </g>

  <!-- ============== B · TOOL REGISTRY ============== -->
  <g transform="translate(20,338)">
    <rect x="0" y="0" width="350" height="140" class="box"/>
    <text x="8" y="16" class="h">B · Tool Registry   <tspan class="proto">⟨I⟩ Tool</tspan></text>
    <text x="8" y="34" class="lbl">examples:</text>
    <text x="8" y="50" class="lbl">documents  — ingest · search · cite</text>
    <text x="8" y="64" class="lbl">query_data — SQL · RBAC-scoped</text>
    <text x="8" y="88" class="mono">POST /tools/execute/&lt;name&gt;</text>
    <text x="8" y="102" class="mono">body: { "args": {...}, "trace_id": ... }</text>
    <text x="8" y="124" class="lbl-i">validated against <tspan class="proto">⟨I⟩ Tool</tspan> · audited · new tool = new class</text>
  </g>

  <!-- ============== C · DATASOURCE ============== -->
  <g transform="translate(390,338)">
    <rect x="0" y="0" width="350" height="140" class="box"/>
    <text x="8" y="16" class="h">C · DataSource Registry   <tspan class="proto">⟨I⟩ DataSource</tspan></text>
    <text x="8" y="34" class="lbl">LocalFile — filesystem (live)</text>
    <text x="8" y="48" class="lbl-b">SharePoint — Graph API [LocalFile mirror]</text>
    <text x="8" y="62" class="lbl-b">SAP — REST / OData [CSV fixtures]</text>
    <text x="8" y="76" class="lbl-b">STK / MATLAB — adapter [reserved]</text>
    <text x="8" y="90" class="lbl-b">Vector index — AI Search [LocalFile]</text>
    <text x="8" y="112" class="lbl-i">per-request · RBAC-scoped · MSAL / OAuth</text>
    <text x="8" y="126" class="lbl-i">response carries doc / page / section + confidence</text>
  </g>

  <!-- ============== D · AUTH ============== -->
  <g transform="translate(20,492)">
    <rect x="0" y="0" width="720" height="42" class="box"/>
    <text x="8" y="14" class="h">D · Auth + RBAC + Trace</text>
    <text x="360" y="28" class="flow">
      <tspan class="flow-k">route</tspan>  →  <tspan class="flow-k">before_request</tspan> (auth · role · trace_id)  →  <tspan class="flow-k">handler</tspan>  →  <tspan class="flow-k">after_request</tspan> (audit emit)  →  <tspan class="flow-k">response</tspan>
    </text>
    <text x="360" y="40" class="lbl-i-c">base(1) &lt; power(2) &lt; admin(3)   ·   role &lt; required → 403   ·   unregistered route → 404 before auth</text>
  </g>
</svg>
