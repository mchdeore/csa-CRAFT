<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1000" font-family="Times New Roman, Times, serif">
  <defs>
    <marker id="arrL3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000"/>
    </marker>
    <style><![CDATA[
      .box { fill: #fff; stroke: #000; stroke-width: 1; }
      .box-dashed { fill: #fff; stroke: #000; stroke-width: 1; stroke-dasharray: 4 2; }
      .boundary { fill: none; stroke: #000; stroke-width: 1.25; }
      .gate { fill: #fff; stroke: #000; stroke-width: 1.2; }
      .terminal { fill: #000; stroke: #000; stroke-width: 1; }
      .lbl-c { font-size: 11px; fill: #000; text-anchor: middle; }
      .lbl { font-size: 10.5px; fill: #000; }
      .lbl-i-c { font-size: 10px; fill: #000; font-style: italic; text-anchor: middle; }
      .lbl-i { font-size: 10px; fill: #000; font-style: italic; }
      .head { font-size: 12px; font-weight: bold; font-variant: small-caps; letter-spacing: 1px; fill: #000; text-anchor: middle; }
      .edge { stroke: #000; stroke-width: 1; fill: none; }
      .edge-aud { stroke: #000; stroke-width: 1; fill: none; stroke-dasharray: 2 2; }
      .title { font-size: 16px; font-weight: bold; font-variant: small-caps; letter-spacing: 1.5px; fill: #000; text-anchor: middle; }
      .iface { font-size: 10px; font-style: italic; fill: #000; text-anchor: middle; }
      .mono { font-family: "Courier New", Courier, monospace; font-size: 10.5px; fill: #000; }
    ]]></style>
  </defs>

  <text x="380" y="24" class="title">L3 · Internal Clusters</text>

  <!-- =============== CLUSTER A : AGENT (with HITL branch off tool_node) =============== -->
  <g transform="translate(20,50)">
    <rect x="0" y="0" width="720" height="290" class="boundary"/>
    <text x="360" y="20" class="head">A · PRIMARY AGENT   (LANGGRAPH REACT)</text>

    <!-- Row 1: chatbot -> should_continue -> tool_node -> audit -> END -->
    <rect x="40"  y="44" width="110" height="52" class="box"/>
    <text x="95"  y="66" class="lbl-c">chatbot</text>
    <text x="95"  y="82" class="lbl-i-c">LLM inference</text>

    <polygon points="180,70 205,46 318,46 343,70 318,94 205,94" class="gate"/>
    <text x="261" y="66" class="lbl-c">should_continue?</text>
    <text x="261" y="82" class="lbl-i-c">loop · limit=25</text>

    <rect x="370" y="44" width="130" height="52" class="box"/>
    <text x="435" y="66" class="lbl-c">tool_node</text>
    <text x="435" y="82" class="lbl-i-c">dispatch · ⟨I⟩ Tool</text>

    <rect x="520" y="44" width="110" height="52" class="box"/>
    <text x="575" y="66" class="lbl-c">audit emit</text>
    <text x="575" y="82" class="lbl-i-c">AgentAction</text>

    <circle cx="670" cy="70" r="14" class="terminal"/>
    <text x="670" y="74" class="lbl-c" fill="#fff">END</text>

    <line x1="150" y1="70" x2="178" y2="70" class="edge" marker-end="url(#arrL3)"/>
    <line x1="343" y1="70" x2="368" y2="70" class="edge" marker-end="url(#arrL3)"/>
    <line x1="500" y1="70" x2="518" y2="70" class="edge-aud" marker-end="url(#arrL3)"/>
    <line x1="630" y1="70" x2="655" y2="70" class="edge" marker-end="url(#arrL3)"/>

    <!-- loop back -->
    <path d="M 435 96 L 435 118 L 95 118 L 95 96" class="edge" marker-end="url(#arrL3)"/>
    <text x="265" y="114" class="lbl-i-c">tool_call → chatbot (loop)</text>

    <!-- HITL branch off tool_node trace (downward) -->
    <polygon points="370,154 400,138 490,138 520,154 490,170 400,170" class="gate"/>
    <text x="445" y="152" class="lbl-c">HITL gate</text>
    <text x="445" y="164" class="lbl-i-c">high-risk intercept</text>
    <path d="M 435 96 L 435 138" class="edge" marker-end="url(#arrL3)"/>
    <text x="440" y="130" class="lbl-i">risk?</text>

    <rect x="540" y="134" width="140" height="40" class="box"/>
    <text x="610" y="150" class="lbl-c">reviewer queue</text>
    <text x="610" y="164" class="lbl-i-c">approve · reject</text>
    <line x1="520" y1="154" x2="538" y2="154" class="edge" marker-end="url(#arrL3)"/>

    <!-- description — in its own sub-box, well inside the boundary -->
    <rect x="20" y="196" width="680" height="80" class="box"/>
    <text x="360" y="214" class="head">HOW ROUTES + GATES COOPERATE</text>
    <text x="34" y="234" class="lbl">1. route gate (before_request) decides WHO may enter — role check · 403 on fail</text>
    <text x="34" y="250" class="lbl">2. HITL gate (interrupt) decides WHAT may complete — pauses high-risk tool_calls</text>
    <text x="34" y="266" class="lbl">3. audit emit (after_request + per-step) records every transition in AgentAction</text>
  </g>

  <!-- =============== CLUSTER B : TOOL REGISTRY (independent) =============== -->
  <g transform="translate(20,370)">
    <rect x="0" y="0" width="350" height="220" class="boundary"/>
    <text x="175" y="20" class="head">B · TOOL REGISTRY   ⟨I⟩ Tool</text>
    <text x="14" y="46" class="lbl">example tools:</text>
    <text x="14" y="64" class="lbl">• documents  — ingest · search · cite</text>
    <text x="14" y="80" class="lbl">• query_data — SQL · RBAC-scoped</text>

    <text x="14" y="108" class="mono">POST /tools/execute/&lt;name&gt;</text>
    <text x="14" y="124" class="mono">body: { "args": {...}, "trace_id": ... }</text>

    <text x="14" y="152" class="lbl-i">each call is validated against ⟨I⟩ Tool,</text>
    <text x="14" y="166" class="lbl-i">audited, and RBAC-scoped. New tool =</text>
    <text x="14" y="180" class="lbl-i">a class satisfying the protocol; the agent</text>
    <text x="14" y="194" class="lbl-i">code is unchanged. HITL wraps high-risk</text>
    <text x="14" y="208" class="lbl-i">tools from the agent's trace (above).</text>
  </g>

  <!-- =============== CLUSTER C : DATASOURCE REGISTRY (independent) =============== -->
  <g transform="translate(390,370)">
    <rect x="0" y="0" width="350" height="220" class="boundary"/>
    <text x="175" y="20" class="head">C · DATASOURCE REGISTRY   ⟨I⟩ DataSource</text>
    <text x="14" y="46"  class="lbl">• LocalFile      — filesystem · live</text>
    <text x="14" y="62"  class="lbl">• SharePoint     — Graph API [blocked · LocalFile mirror]</text>
    <text x="14" y="78"  class="lbl">• SAP            — REST / OData [blocked · CSV fixtures]</text>
    <text x="14" y="94"  class="lbl">• STK / MATLAB   — adapter [blocked · slot reserved]</text>
    <text x="14" y="110" class="lbl">• Vector index   — AI Search [blocked · LocalFile hybrid]</text>
    <text x="14" y="126" class="lbl">• Per-source auth — MSAL · OAuth · svc acct</text>

    <text x="14" y="156" class="lbl-i">datasources are swappable: a tool reads through the</text>
    <text x="14" y="170" class="lbl-i">⟨I⟩ DataSource protocol so the same tool works</text>
    <text x="14" y="184" class="lbl-i">against local files today and SharePoint / SAP when</text>
    <text x="14" y="206" class="lbl-i">those connectors clear their dev flag.</text>
  </g>

  <!-- =============== CLUSTER D : AUTH + TRACE =============== -->
  <g transform="translate(20,620)">
    <rect x="0" y="0" width="720" height="260" class="boundary"/>
    <text x="360" y="20" class="head">D · AUTH + RBAC + TRACE</text>

    <!-- Flow -->
    <rect x="30"  y="40" width="130" height="56" class="box"/>
    <text x="95"  y="60" class="lbl-c">Flask route</text>
    <text x="95"  y="76" class="lbl-i-c">handler entry</text>

    <polygon points="190,68 215,45 310,45 335,68 310,91 215,91" class="gate"/>
    <text x="262" y="64" class="lbl-c">before_request</text>
    <text x="262" y="78" class="lbl-i-c">auth · role · ws</text>
    <text x="262" y="90" class="lbl-i-c">trace_id · ctx</text>

    <rect x="360" y="40" width="130" height="56" class="box"/>
    <text x="425" y="60" class="lbl-c">handler</text>
    <text x="425" y="76" class="lbl-i-c">route body</text>

    <polygon points="520,68 545,45 640,45 665,68 640,91 545,91" class="gate"/>
    <text x="592" y="64" class="lbl-c">after_request</text>
    <text x="592" y="78" class="lbl-i-c">audit emit</text>
    <text x="592" y="90" class="lbl-i-c">AgentAction</text>

    <line x1="160" y1="68" x2="188" y2="68" class="edge" marker-end="url(#arrL3)"/>
    <line x1="335" y1="68" x2="358" y2="68" class="edge" marker-end="url(#arrL3)"/>
    <line x1="490" y1="68" x2="518" y2="68" class="edge" marker-end="url(#arrL3)"/>

    <!-- Pseudocode route + roles -->
    <rect x="30"  y="118" width="340" height="86" class="box"/>
    <text x="200" y="136" class="head">ROUTE (PSEUDOCODE)</text>
    <text x="42" y="156" class="mono">@route("/path/*", role=&lt;required&gt;)</text>
    <text x="42" y="172" class="mono">def handler(req):</text>
    <text x="42" y="188" class="mono">    before_request();  after_request()</text>

    <rect x="390" y="118" width="310" height="86" class="box"/>
    <text x="545" y="136" class="head">EXAMPLE ROLES</text>
    <text x="402" y="156" class="mono">base   (1)  — read · chat</text>
    <text x="402" y="172" class="mono">power  (2)  — + upload · tools</text>
    <text x="402" y="188" class="mono">admin  (3)  — + /admin/*</text>

    <text x="30" y="226" class="lbl-i">test surface — pytest invariants on route × role matrix, protocol contracts, audit envelope presence.</text>
    <text x="30" y="244" class="lbl-i">role &lt; required → 403   ·   unregistered route → 404 before auth   ·   base &lt; power &lt; admin</text>
  </g>
</svg>
