<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="Times New Roman, Times, serif">
  <defs>
    <marker id="arrL3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000"/>
    </marker>
    <style><![CDATA[
      .box { fill: #fff; stroke: #000; stroke-width: 0.9; }
      .box-d { fill: #fff; stroke: #000; stroke-width: 0.9; stroke-dasharray: 4 2; }
      .gate { fill: #fff; stroke: #000; stroke-width: 1; }
      .term { fill: #000; stroke: #000; stroke-width: 1; }
      .lbl-c { font-size: 10.5px; fill: #000; text-anchor: middle; }
      .lbl   { font-size: 10.5px; fill: #000; }
      .lbl-i-c { font-size: 9.5px; fill: #000; font-style: italic; text-anchor: middle; }
      .lbl-i   { font-size: 9.5px; fill: #000; font-style: italic; }
      .h  { font-size: 10.5px; font-weight: bold; fill: #000; }
      .edge { stroke: #000; stroke-width: 0.9; fill: none; }
      .edge-d { stroke: #000; stroke-width: 0.9; fill: none; stroke-dasharray: 2 2; }
      .title { font-size: 13px; font-weight: bold; fill: #000; text-anchor: middle; }
      .mono { font-family: "Courier New", Courier, monospace; font-size: 10px; fill: #000; }
      .flow { font-size: 11px; fill: #000; text-anchor: middle; }
      .flow-k { font-size: 11px; font-weight: bold; fill: #000; }
    ]]></style>
  </defs>

  <text x="380" y="18" class="title">Figure 2 · L3 — Internal Clusters</text>

  <!-- CLUSTER A : AGENT -->
  <g transform="translate(20,36)">
    <rect x="0" y="0" width="720" height="170" class="box"/>
    <text x="8" y="16" class="h">A · Primary Agent (LangGraph ReAct)</text>

    <rect x="30"  y="34" width="100" height="44" class="box"/>
    <text x="80"  y="54" class="lbl-c">chatbot</text>
    <text x="80"  y="68" class="lbl-i-c">LLM inference</text>

    <polygon points="160,56 184,36 288,36 312,56 288,76 184,76" class="gate"/>
    <text x="236" y="54" class="lbl-c">should_continue?</text>
    <text x="236" y="68" class="lbl-i-c">loop · limit</text>

    <rect x="340" y="34" width="120" height="44" class="box"/>
    <text x="400" y="54" class="lbl-c">tool_node</text>
    <text x="400" y="68" class="lbl-i-c">dispatch · ⟨I⟩ Tool</text>

    <rect x="490" y="34" width="110" height="44" class="box"/>
    <text x="545" y="54" class="lbl-c">audit emit</text>
    <text x="545" y="68" class="lbl-i-c">AgentAction</text>

    <circle cx="640" cy="56" r="12" class="term"/>
    <text x="640" y="60" class="lbl-c" fill="#fff">END</text>

    <line x1="130" y1="56" x2="158" y2="56" class="edge" marker-end="url(#arrL3)"/>
    <line x1="312" y1="56" x2="338" y2="56" class="edge" marker-end="url(#arrL3)"/>
    <line x1="460" y1="56" x2="488" y2="56" class="edge-d" marker-end="url(#arrL3)"/>
    <line x1="600" y1="56" x2="627" y2="56" class="edge" marker-end="url(#arrL3)"/>

    <path d="M 400 78 L 400 100 L 80 100 L 80 78" class="edge" marker-end="url(#arrL3)"/>
    <text x="240" y="96" class="lbl-i-c">tool_call → chatbot (loop)</text>

    <polygon points="340,138 365,122 445,122 470,138 445,154 365,154" class="gate"/>
    <text x="405" y="136" class="lbl-c">HITL gate</text>
    <text x="405" y="148" class="lbl-i-c">high-risk</text>
    <path d="M 400 78 L 400 122" class="edge" marker-end="url(#arrL3)"/>
    <text x="405" y="112" class="lbl-i">risk?</text>

    <rect x="490" y="118" width="140" height="40" class="box"/>
    <text x="560" y="134" class="lbl-c">reviewer queue</text>
    <text x="560" y="148" class="lbl-i-c">approve · reject</text>
    <line x1="470" y1="138" x2="488" y2="138" class="edge" marker-end="url(#arrL3)"/>
  </g>

  <!-- CLUSTER B : TOOL REGISTRY -->
  <g transform="translate(20,220)">
    <rect x="0" y="0" width="350" height="140" class="box"/>
    <text x="8" y="16" class="h">B · Tool Registry   ⟨I⟩ Tool</text>
    <text x="8" y="34" class="lbl">examples:</text>
    <text x="8" y="50" class="lbl">documents  — ingest · search · cite</text>
    <text x="8" y="64" class="lbl">query_data — SQL · RBAC-scoped</text>
    <text x="8" y="88" class="mono">POST /tools/execute/&lt;name&gt;</text>
    <text x="8" y="102" class="mono">body: { "args": {...}, "trace_id": ... }</text>
    <text x="8" y="124" class="lbl-i">validated against ⟨I⟩ Tool · audited · new tool = new class</text>
  </g>

  <!-- CLUSTER C : DATASOURCE -->
  <g transform="translate(390,220)">
    <rect x="0" y="0" width="350" height="140" class="box"/>
    <text x="8" y="16" class="h">C · DataSource Registry   ⟨I⟩ DataSource</text>
    <text x="8" y="34" class="lbl">LocalFile    — filesystem (live)</text>
    <text x="8" y="48" class="lbl">SharePoint   — Graph API [blocked · mirror]</text>
    <text x="8" y="62" class="lbl">SAP          — REST / OData [blocked · fixtures]</text>
    <text x="8" y="76" class="lbl">STK / MATLAB — adapter [blocked · reserved]</text>
    <text x="8" y="90" class="lbl">Vector index — AI Search [blocked · LocalFile]</text>
    <text x="8" y="112" class="lbl-i">per-request · RBAC-scoped · MSAL / OAuth</text>
    <text x="8" y="126" class="lbl-i">response carries doc / page / section + confidence</text>
  </g>

  <!-- CLUSTER D : AUTH as single-line text flow -->
  <g transform="translate(20,374)">
    <rect x="0" y="0" width="720" height="52" class="box"/>
    <text x="8" y="16" class="h">D · Auth + RBAC + Trace</text>
    <text x="360" y="34" class="flow">
      <tspan class="flow-k">route</tspan>  →  <tspan class="flow-k">before_request</tspan> (auth · role · trace_id)  →  <tspan class="flow-k">handler</tspan>  →  <tspan class="flow-k">after_request</tspan> (audit emit)  →  <tspan class="flow-k">response</tspan>
    </text>
    <text x="360" y="48" class="lbl-i-c">base(1) &lt; power(2) &lt; admin(3)   ·   role &lt; required → 403   ·   unregistered route → 404 before auth</text>
  </g>
</svg>
