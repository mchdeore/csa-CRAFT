<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" font-family="Times New Roman, Times, serif">
  <defs>
    <marker id="arrL2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000"/>
    </marker>
    <style><![CDATA[
      .box { fill: #fff; stroke: #000; stroke-width: 1; }
      .box-dashed { fill: #fff; stroke: #000; stroke-width: 1; stroke-dasharray: 4 2; }
      .boundary { fill: none; stroke: #000; stroke-width: 1.25; }
      .boundary-d { fill: none; stroke: #000; stroke-width: 1.25; stroke-dasharray: 4 2; }
      .band { fill: #f0f0f0; stroke: #000; stroke-width: 1; }
      .lbl { font-size: 11px; fill: #000; }
      .lbl-c { font-size: 11px; fill: #000; text-anchor: middle; }
      .lbl-i { font-size: 10px; fill: #000; font-style: italic; }
      .lbl-i-c { font-size: 10px; fill: #000; font-style: italic; text-anchor: middle; }
      .head { font-size: 11px; font-weight: bold; font-variant: small-caps; letter-spacing: 0.8px; fill: #000; text-anchor: middle; }
      .head-l { font-size: 11px; font-weight: bold; font-variant: small-caps; letter-spacing: 0.8px; fill: #000; }
      .iface { font-size: 9.5px; font-style: italic; fill: #000; text-anchor: middle; }
      .edge { stroke: #000; stroke-width: 1; fill: none; }
      .edge-aud { stroke: #000; stroke-width: 1; fill: none; stroke-dasharray: 2 2; }
      .title { font-size: 15px; font-weight: bold; font-variant: small-caps; letter-spacing: 1.5px; fill: #000; text-anchor: middle; }
      .mono { font-family: "Courier New", Courier, monospace; font-size: 9.5px; fill: #000; }
      .mono-c { font-family: "Courier New", Courier, monospace; font-size: 9.5px; fill: #000; text-anchor: middle; }
    ]]></style>
  </defs>

  <text x="600" y="22" class="title">L2 · Containers · Actors · External Systems</text>

  <!-- ============== ACTORS (left column) ============== -->
  <g transform="translate(20,60)">
    <rect x="0" y="0" width="150" height="200" class="boundary"/>
    <text x="75" y="18" class="head">ACTORS</text>
    <rect x="12" y="30" width="126" height="36" class="box"/>
    <text x="75" y="48" class="lbl-c">Mission Engineer</text>
    <text x="75" y="60" class="lbl-i-c">corpus · HITL submit</text>
    <rect x="12" y="72" width="126" height="36" class="box"/>
    <text x="75" y="90" class="lbl-c">Systems Engineer</text>
    <text x="75" y="102" class="lbl-i-c">risk · retrieval</text>
    <rect x="12" y="114" width="126" height="36" class="box"/>
    <text x="75" y="132" class="lbl-c">Program Admin</text>
    <text x="75" y="144" class="lbl-i-c">cost · forecast</text>
    <rect x="12" y="156" width="126" height="36" class="box"/>
    <text x="75" y="174" class="lbl-c">HITL Reviewer</text>
    <text x="75" y="186" class="lbl-i-c">approve · reject</text>
  </g>

  <!-- ============== RBAC BAND (route list) — top center ============== -->
  <g transform="translate(190,60)">
    <rect x="0" y="0" width="820" height="200" class="band"/>
    <text x="410" y="18" class="head">ROUTE-GATED RBAC LAYER   —   ⟨I⟩ AuthProvider</text>
    <text x="18" y="40" class="mono">POST  /chat/send</text>              <text x="300" y="40" class="lbl">[base · 1]</text>
    <text x="18" y="58" class="mono">POST  /chat/upload</text>            <text x="300" y="58" class="lbl">[power · 2]</text>
    <text x="18" y="76" class="mono">GET   /storage/list/*</text>          <text x="300" y="76" class="lbl">[base · 1]</text>
    <text x="18" y="94" class="mono">POST  /tools/execute/&lt;name&gt;</text>  <text x="300" y="94" class="lbl">[internal]</text>
    <text x="18" y="112" class="mono">GET   /admin/*</text>                <text x="300" y="112" class="lbl">[admin · 3]</text>
    <text x="18" y="130" class="mono">GET   /uploads</text>                <text x="300" y="130" class="lbl">[power · 2]</text>

    <!-- role hierarchy block (right side of route list) -->
    <rect x="430" y="30" width="370" height="60" class="box"/>
    <text x="615" y="48" class="head">ROLE LEVELS</text>
    <text x="615" y="68" class="lbl-c">base(1) &lt; power(2) &lt; admin(3)</text>
    <text x="615" y="82" class="lbl-i-c">_ROUTE_RULES · _ROLE_LEVEL · before_request</text>

    <!-- audit envelope block -->
    <rect x="430" y="100" width="370" height="88" class="box"/>
    <text x="615" y="118" class="head">AUDIT ENVELOPE   —   ⟨I⟩ AgentActionLog</text>
    <text x="615" y="138" class="lbl-c">AgentAction { user · role · trace_id · tool · args · result }</text>
    <text x="615" y="154" class="lbl-i-c">emitted on: before_request · llm_inference · tool_call · after_request</text>
    <text x="615" y="172" class="lbl-i-c">JSONL (90-day local) → Azure Log Analytics (immutable, dev flag)</text>
  </g>

