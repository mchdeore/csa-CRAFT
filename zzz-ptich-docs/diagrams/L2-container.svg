  <g transform="translate(1030,60)">
    <rect x="0" y="0" width="150" height="200" class="boundary"/>
    <text x="75" y="18" class="head">EXTERNAL</text>

    <rect x="12" y="30" width="126" height="34" class="box"/>
    <text x="75" y="46" class="lbl-c">Azure OpenAI</text>
    <text x="75" y="58" class="lbl-i-c">gpt-4o</text>

    <rect x="12" y="68" width="126" height="34" class="box-dashed"/>
    <text x="75" y="84" class="lbl-c">Azure AI Search</text>
    <text x="75" y="96" class="lbl-i-c">hybrid retrieval</text>

    <rect x="12" y="106" width="126" height="34" class="box-dashed"/>
    <text x="75" y="122" class="lbl-c">Entra ID</text>
    <text x="75" y="134" class="lbl-i-c">identity</text>

    <rect x="12" y="144" width="126" height="34" class="box-dashed"/>
    <text x="75" y="160" class="lbl-c">Content Safety</text>
    <text x="75" y="172" class="lbl-i-c">guardrails</text>

    <rect x="12" y="182" width="126" height="34" class="box-dashed"/>
    <text x="75" y="198" class="lbl-c">APIM · App GW</text>
    <text x="75" y="210" class="lbl-i-c">edge · WAF</text>
  </g>

