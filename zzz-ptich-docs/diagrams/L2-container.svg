    <rect x="20"  y="30" width="180" height="30" class="box"/>
    <text x="110" y="50" class="lbl-c">Tool protocol</text>
    <rect x="220" y="30" width="180" height="30" class="box"/>
    <text x="310" y="50" class="lbl-c">DataSource protocol</text>
    <rect x="20"  y="68" width="180" height="30" class="box-dashed"/>
