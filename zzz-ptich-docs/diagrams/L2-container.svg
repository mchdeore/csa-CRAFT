<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" font-family="Times New Roman, Times, serif">
  <defs>
    <marker id="arrL2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000"/>
    </marker>
    <style><![CDATA[
      .box { fill: #fff; stroke: #000; stroke-width: 1; }
      .box-dashed { fill: #fff; stroke: #000; stroke-width: 1; stroke-dasharray: 4 2; }
      .boundary { fill: none; stroke: #000; stroke-width: 1.25; }
      .band { fill: #f0f0f0; stroke: #000; stroke-width: 1; }
      .label { font-size: 11px; fill: #000; text-anchor: middle; }
      .label-small { font-size: 9px; fill: #000; text-anchor: middle; font-style: italic; }
      .label-l { font-size: 10px; fill: #000; }
      .group-head { font-size: 11px; font-weight: bold; font-variant: small-caps; letter-spacing: 0.8px; fill: #000; text-anchor: middle; }
      .edge { stroke: #000; stroke-width: 1; fill: none; }
      .edge-audit { stroke: #000; stroke-width: 1; fill: none; stroke-dasharray: 2 2; }
      .title { font-size: 15px; font-weight: bold; font-variant: small-caps; letter-spacing: 1.5px; fill: #000; text-anchor: middle; }
      .iface { font-size: 9px; font-style: italic; fill: #000; text-anchor: middle; }
    ]]></style>
  </defs>

  <text x="500" y="22" class="title">L2 · Container Diagram</text>

  <!-- ========= RBAC BAND (top) ========= -->
  <g transform="translate(0,40)">
    <rect x="40" y="0" width="920" height="56" class="band"/>
    <text x="500" y="18" class="group-head">ROUTE-GATED RBAC LAYER</text>
    <rect x="80"  y="26" width="240" height="22" class="box"/>
    <text x="200" y="41" class="label">/chat/send   [base · 1]</text>
    <rect x="380" y="26" width="240" height="22" class="box"/>
    <text x="500" y="41" class="label">/uploads     [power · 2]</text>
    <rect x="680" y="26" width="240" height="22" class="box"/>
    <text x="800" y="41" class="label">/admin/*     [admin · 3]</text>
  </g>

  <!-- ========= CORE ROW ========= -->
  <g transform="translate(0,120)">
    <!-- Primary Agent -->
    <rect x="60"  y="0" width="200" height="100" class="box"/>
    <text x="160" y="20" class="group-head">PRIMARY AGENT</text>
    <text x="160" y="40" class="label">LangGraph ReAct</text>
    <text x="160" y="56" class="label-small">recursion_limit = 25</text>
    <text x="160" y="78" class="iface">⟨I⟩ ChatProvider</text>
    <text x="160" y="92" class="iface">⟨I⟩ AgentActionLog</text>

    <!-- Tool Registry -->
    <rect x="320" y="0" width="200" height="100" class="box"/>
    <text x="420" y="20" class="group-head">TOOL REGISTRY</text>
    <text x="420" y="40" class="label">weather · docs · charts</text>
    <text x="420" y="56" class="label">query · code-exec</text>
    <text x="420" y="78" class="iface">⟨I⟩ Tool</text>
    <text x="420" y="92" class="iface">POST /tools/exec/&lt;name&gt;</text>

    <!-- HITL + Review -->
    <rect x="580" y="0" width="200" height="100" class="box"/>
    <text x="680" y="20" class="group-head">HITL REVIEW</text>
    <text x="680" y="40" class="label">LangGraph interrupt</text>
    <text x="680" y="56" class="label">Postgres approval queue</text>
    <text x="680" y="78" class="iface">Dash reviewer UI</text>
    <text x="680" y="92" class="iface">approve · reject · trace</text>

    <!-- Audit sink -->
    <rect x="820" y="0" width="140" height="100" class="box"/>
    <text x="890" y="20" class="group-head">AUDIT SINK</text>
    <text x="890" y="42" class="label">AgentAction</text>
    <text x="890" y="56" class="label">envelope</text>
    <text x="890" y="78" class="iface">JSONL → LA</text>
    <text x="890" y="92" class="iface">tamper-proof</text>
  </g>

  <!-- ========= STORAGE ROW (aligned) ========= -->
  <g transform="translate(0,260)">
    <text x="500" y="0" class="group-head">STORAGE — ⟨I⟩ WorkspaceStore</text>
    <rect x="60"  y="12" width="210" height="72" class="box"/>
    <text x="165" y="30" class="label">WorkspaceStore</text>
    <text x="165" y="46" class="label-small">session · scratch</text>
    <text x="165" y="68" class="iface">SqliteStore + ScratchStore</text>

    <rect x="300" y="12" width="210" height="72" class="box"/>
    <text x="405" y="30" class="label">DataStore (RBAC)</text>
    <text x="405" y="46" class="label-small">per-user query scope</text>
    <text x="405" y="68" class="iface">SqliteDataStore</text>

    <rect x="540" y="12" width="210" height="72" class="box"/>
    <text x="645" y="30" class="label">AuditLog</text>
    <text x="645" y="46" class="label-small">JSONL append-only</text>
    <text x="645" y="68" class="iface">→ Log Analytics</text>

    <rect x="780" y="12" width="180" height="72" class="box-dashed"/>
    <text x="870" y="30" class="label">Immutability</text>
    <text x="870" y="46" class="label-small">LA retention</text>
    <text x="870" y="68" class="iface">dev flag · IT</text>
  </g>

  <!-- ========= CONNECTORS ROW (perimeter, bottom-left) ========= -->
  <g transform="translate(0,380)">
    <rect x="40" y="0" width="580" height="110" class="boundary"/>
    <text x="330" y="18" class="group-head">CONNECTORS — PERIMETER · ⟨I⟩ DataSource</text>
    <rect x="60"  y="30" width="120" height="60" class="box"/>
    <text x="120" y="54" class="label">LocalFile</text>
    <text x="120" y="70" class="label-small">live</text>

    <rect x="200" y="30" width="120" height="60" class="box-dashed"/>
    <text x="260" y="54" class="label">SharePoint</text>
    <text x="260" y="70" class="label-small">dev flag</text>

    <rect x="340" y="30" width="120" height="60" class="box-dashed"/>
    <text x="400" y="54" class="label">SAP</text>
    <text x="400" y="70" class="label-small">dev flag</text>

    <rect x="480" y="30" width="120" height="60" class="box-dashed"/>
    <text x="540" y="54" class="label">STK / MATLAB</text>
    <text x="540" y="70" class="label-small">dev flag</text>
  </g>

  <!-- ========= EXTENSIONS ROW (bottom-right) ========= -->
  <g transform="translate(0,380)">
    <rect x="640" y="0" width="320" height="110" class="boundary"/>
    <text x="800" y="18" class="group-head">EXTENSIONS</text>
    <rect x="660" y="30" width="130" height="30" class="box"/>
    <text x="725" y="49" class="label">Tool protocol</text>
    <rect x="810" y="30" width="130" height="30" class="box"/>
    <text x="875" y="49" class="label">DataSource</text>
    <rect x="660" y="68" width="130" height="30" class="box-dashed"/>
    <text x="725" y="87" class="label">CodeExec sandbox</text>
    <rect x="810" y="68" width="130" height="30" class="box-dashed"/>
    <text x="875" y="87" class="label">Content Safety</text>
  </g>

  <!-- ========= TEST SURFACE (very bottom) ========= -->
  <g transform="translate(0,510)">
    <rect x="40" y="0" width="920" height="54" class="band"/>
    <text x="500" y="20" class="group-head">TEST SURFACE — ARCHITECTURE INVARIANTS</text>
    <text x="500" y="40" class="label">pytest · ruff · pyright · bandit · pip-audit · detect-secrets   —   pre-commit + GitHub Actions</text>
  </g>

  <!-- ========= EDGES ========= -->
  <!-- RBAC band -> core row -->
  <line x1="200" y1="96"  x2="160" y2="120" class="edge" marker-end="url(#arrL2)"/>
  <line x1="500" y1="96"  x2="420" y2="120" class="edge" marker-end="url(#arrL2)"/>
  <line x1="800" y1="96"  x2="680" y2="120" class="edge" marker-end="url(#arrL2)"/>

  <!-- core row internal -->
  <line x1="260" y1="170" x2="320" y2="170" class="edge" marker-end="url(#arrL2)"/>
  <line x1="520" y1="170" x2="580" y2="170" class="edge" marker-end="url(#arrL2)"/>

  <!-- core -> audit sink -->
  <path d="M 160 220 L 160 240 L 890 240 L 890 220" class="edge-audit" marker-end="url(#arrL2)"/>
  <path d="M 420 220 L 420 236 L 886 236" class="edge-audit"/>
  <path d="M 680 220 L 680 232 L 884 232" class="edge-audit"/>

  <!-- core -> storage row -->
  <line x1="160" y1="220" x2="165" y2="272" class="edge" marker-end="url(#arrL2)"/>
  <line x1="420" y1="220" x2="405" y2="272" class="edge" marker-end="url(#arrL2)"/>
  <line x1="890" y1="220" x2="645" y2="272" class="edge-audit" marker-end="url(#arrL2)"/>

  <!-- storage -> connectors + extensions (vertical rails) -->
  <line x1="165" y1="344" x2="120" y2="380" class="edge" marker-end="url(#arrL2)"/>
  <line x1="405" y1="344" x2="260" y2="380" class="edge" marker-end="url(#arrL2)"/>
  <line x1="645" y1="344" x2="725" y2="380" class="edge" marker-end="url(#arrL2)"/>
  <line x1="870" y1="344" x2="875" y2="380" class="edge" marker-end="url(#arrL2)"/>
</svg>
