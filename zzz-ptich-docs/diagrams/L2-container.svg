  <line x1="600" y1="260" x2="470" y2="300" class="edge" marker-end="url(#arrL2)"/>
  <line x1="600" y1="260" x2="770" y2="300" class="edge" marker-end="url(#arrL2)"/>
  <line x1="600" y1="260" x2="1040" y2="300" class="edge" marker-end="url(#arrL2)"/>

  <!-- Primary Agent -> external (right) -->
