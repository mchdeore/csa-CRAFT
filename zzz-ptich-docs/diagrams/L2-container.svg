<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 580" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <style><![CDATA[
      .box { fill: #fff; stroke: #000; stroke-width: 0.9; }
      .lbl { font-size: 10.5px; fill: #000; }
      .lbl-c { font-size: 10.5px; fill: #000; text-anchor: middle; }
      .lbl-b { font-size: 10.5px; fill: #000; font-style: italic; text-decoration: underline; }
      .lbl-i { font-size: 9.5px; fill: #000; font-style: italic; }
      .h  { font-size: 10.5px; font-weight: 600; fill: #000; }
      .hc { font-size: 10.5px; font-weight: 600; fill: #000; text-anchor: middle; }
      .mono { font-family: "SF Mono", Menlo, Consolas, "Courier New", monospace; font-size: 10px; fill: #000; }
      .title { font-size: 13px; font-weight: 600; fill: #000; text-anchor: middle; }
      .num { font-size: 13px; font-weight: 700; fill: #fff; text-anchor: middle; dominant-baseline: central; }
      .numcirc { fill: #000; }
      .proto { font-weight: 700; }
    ]]></style>
  </defs>

  <text x="380" y="18" class="title">Figure 1 · L2 — Containers, Actors, External Systems</text>

  <!-- 1 ACTORS -->
  <g transform="translate(20,36)">
    <rect x="0" y="0" width="720" height="42" class="box"/>
    <circle cx="18" cy="21" r="11" class="numcirc"/><text x="18" y="21" class="num">1</text>
    <text x="36" y="18" class="h">Actors</text>
    <text x="36" y="34" class="lbl">Mission Engineer · Systems Engineer · Program Admin · HITL Reviewer · external agent / trigger</text>
  </g>

  <!-- 2 RBAC -->
  <g transform="translate(20,88)">
    <rect x="0" y="0" width="720" height="106" class="box"/>
    <circle cx="18" cy="21" r="11" class="numcirc"/><text x="18" y="21" class="num">2</text>
    <text x="36" y="18" class="h">Route-gated RBAC   <tspan class="proto">⟨I⟩ AuthProvider</tspan></text>
    <text x="36" y="34" class="mono">@route("/path/*", role=&lt;required&gt;)  def handler(req): before_request(); after_request()</text>
    <text x="36" y="50" class="lbl-i">before_request → auth · role · trace_id   ·   after_request → audit emit (AgentAction)</text>
    <text x="36" y="72" class="mono">base   (1)   read · chat</text>
    <text x="36" y="88" class="mono">power  (2)   + upload · tools</text>
    <text x="36" y="102" class="mono">admin  (3)   + /admin/*</text>
    <text x="380" y="72" class="lbl-i">role &lt; required → 403</text>
    <text x="380" y="88" class="lbl-i">unregistered route → 404 (before auth)</text>
    <text x="380" y="102" class="lbl-i">any external principal with the right role can call</text>
  </g>

  <!-- 3 PRIMARY AGENT -->
  <g transform="translate(20,204)">
    <rect x="0" y="0" width="720" height="46" class="box"/>
    <circle cx="18" cy="21" r="11" class="numcirc"/><text x="18" y="21" class="num">3</text>
    <text x="36" y="18" class="h">Primary Agent (entry point)</text>
    <text x="36" y="32" class="lbl">LangGraph ReAct · bounded recursion · HITL interrupt</text>
    <text x="36" y="42" class="lbl-i"><tspan class="proto">⟨I⟩ ChatProvider</tspan>   <tspan class="proto">⟨I⟩ AgentActionLog</tspan>   <tspan class="proto">⟨I⟩ Tool</tspan></text>
  </g>

  <!-- 4 REGISTRIES -->
  <g transform="translate(20,260)">
    <rect x="0" y="0" width="350" height="118" class="box"/>
    <circle cx="18" cy="21" r="11" class="numcirc"/><text x="18" y="21" class="num">4</text>
    <text x="36" y="18" class="h">Tool Registry   <tspan class="proto">⟨I⟩ Tool</tspan></text>
    <text x="8" y="40" class="lbl">documents — ingest · search · cite</text>
    <text x="8" y="54" class="lbl">query_data — SQL · RBAC-scoped</text>
    <text x="8" y="76" class="mono">POST /tools/execute/&lt;name&gt;</text>
    <text x="8" y="92" class="lbl-i">validated against <tspan class="proto">⟨I⟩ Tool</tspan> · audited</text>
    <text x="8" y="106" class="lbl-i">new tool = new class, agent unchanged</text>

    <rect x="370" y="0" width="350" height="118" class="box"/>
    <circle cx="388" cy="21" r="11" class="numcirc"/><text x="388" y="21" class="num">4</text>
    <text x="406" y="18" class="h">DataSource Registry   <tspan class="proto">⟨I⟩ DataSource</tspan></text>
    <text x="378" y="40" class="lbl">LocalFile — filesystem (live)</text>
    <text x="378" y="54" class="lbl-b">SharePoint — Graph API [LocalFile mirror]</text>
    <text x="378" y="68" class="lbl-b">SAP — REST / OData [CSV fixtures]</text>
    <text x="378" y="82" class="lbl-b">STK / MATLAB — adapter [reserved]</text>
    <text x="378" y="96" class="lbl-b">Vector index — AI Search [LocalFile hybrid]</text>
    <text x="378" y="112" class="lbl-i">per-request · RBAC-scoped · MSAL / OAuth</text>
  </g>

  <!-- 5 STORAGE -->
  <g transform="translate(20,388)">
    <rect x="0" y="0" width="720" height="66" class="box"/>
    <circle cx="18" cy="21" r="11" class="numcirc"/><text x="18" y="21" class="num">5</text>
    <text x="36" y="18" class="h">Storage   <tspan class="proto">⟨I⟩ WorkspaceStore</tspan></text>
    <line x1="240" y1="26" x2="240" y2="64" stroke="#000" stroke-width="0.4" stroke-dasharray="2 2"/>
    <line x1="480" y1="26" x2="480" y2="64" stroke="#000" stroke-width="0.4" stroke-dasharray="2 2"/>
    <text x="120" y="38" class="hc">Workspace Store</text>
    <text x="120" y="52" class="lbl-c">SqliteStore + ScratchStore</text>
    <text x="120" y="62" class="lbl-c" font-style="italic">session · scratch</text>
    <text x="360" y="38" class="hc">Data Store (RBAC)</text>
    <text x="360" y="52" class="lbl-c">SqliteDataStore</text>
    <text x="360" y="62" class="lbl-c" font-style="italic">per-user query scope</text>
    <text x="600" y="38" class="hc">Audit Log</text>
    <text x="600" y="52" class="lbl-c">JSONL append-only</text>
    <text x="600" y="62" class="lbl-c" font-style="italic">→ Log Analytics (end state)</text>
  </g>

  <!-- 6 EXTERNAL -->
  <g transform="translate(20,464)">
    <rect x="0" y="0" width="720" height="80" class="box"/>
    <circle cx="18" cy="21" r="11" class="numcirc"/><text x="18" y="21" class="num">6</text>
    <text x="36" y="18" class="h">External systems — end state: Azure-consolidated (Foundry · IQ)</text>
    <text x="8" y="38" class="lbl">Azure OpenAI — LLM inference (live)</text>
    <text x="8" y="52" class="lbl-b">Azure AI Search — hybrid retrieval  [LocalFileSource today]</text>
    <text x="8" y="66" class="lbl-b">Entra ID — identity · MSAL  [local stub today]</text>
    <text x="8" y="80" class="lbl-b">Content Safety — guardrails  [wrapper off today]</text>
    <text x="378" y="38" class="lbl-b">APIM · App Gateway — edge · WAF  [direct App Service today]</text>
    <text x="378" y="52" class="lbl-b">Log Analytics — immutable audit  [JSONL on disk today]</text>
    <text x="378" y="66" class="lbl-b">Azure Container Apps — code-exec sandbox  [reserved]</text>
    <text x="378" y="80" class="lbl">Postgres — HITL queue · 3-tier memory  (staged)</text>
  </g>

  <!-- 7 TEST -->
  <g transform="translate(20,554)">
    <rect x="0" y="0" width="720" height="22" class="box"/>
    <circle cx="18" cy="11" r="11" class="numcirc"/><text x="18" y="11" class="num">7</text>
    <text x="36" y="14" class="lbl">Test surface — ruff · pyright · pytest · bandit · pip-audit · detect-secrets   (pre-commit + CI)</text>
  </g>
</svg>
