    <text x="725" y="76" class="iface">AgentAction sink</text>

    <text x="1015" y="44" class="lbl-c" font-weight="bold">Log Analytics</text>
    <text x="1015" y="60" class="lbl-i-c">immutable · tamper-proof</text>
    <text x="1015" y="76" class="iface">dev flag · IT</text>
  </g>

