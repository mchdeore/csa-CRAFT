    <line x1="290" y1="26" x2="290" y2="86" stroke="#000" stroke-width="0.5" stroke-dasharray="2 2"/>
    <line x1="580" y1="26" x2="580" y2="86" stroke="#000" stroke-width="0.5" stroke-dasharray="2 2"/>
    <line x1="870" y1="26" x2="870" y2="86" stroke="#000" stroke-width="0.5" stroke-dasharray="2 2"/>

