    <rect x="0" y="0" width="300" height="110" class="box"/>
    <text x="150" y="20" class="head">PRIMARY AGENT</text>
    <text x="150" y="38" class="lbl-c">LangGraph ReAct · recursion_limit=25</text>
    <text x="150" y="56" class="lbl-i-c">chatbot ⇄ tool_node · HITL interrupt</text>
    <text x="150" y="78" class="iface">⟨I⟩ ChatProvider</text>
    <text x="150" y="94" class="iface">⟨I⟩ AgentActionLog</text>

    <!-- Tool Registry -->
    <rect x="320" y="0" width="300" height="110" class="box"/>
    <text x="470" y="20" class="head">TOOL REGISTRY   —   ⟨I⟩ Tool</text>
    <text x="470" y="40" class="lbl-c">weather · documents · charts</text>
    <text x="470" y="56" class="lbl-c">query_data · code_exec · report</text>
    <text x="470" y="78" class="iface">POST /tools/execute/&lt;name&gt;</text>
    <text x="470" y="94" class="iface">validated · audited · RBAC-scoped</text>

    <!-- HITL Review -->
    <rect x="640" y="0" width="260" height="110" class="box"/>
    <text x="770" y="20" class="head">HITL REVIEW</text>
    <text x="770" y="40" class="lbl-c">LangGraph interrupt</text>
    <text x="770" y="56" class="lbl-c">Postgres approval queue</text>
    <text x="770" y="78" class="iface">Dash reviewer UI</text>
    <text x="770" y="94" class="iface">approve · reject · trace</text>

    <!-- Data Sources container -->
