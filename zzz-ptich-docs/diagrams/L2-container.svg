  <line x1="145" y1="530" x2="95" y2="560" class="edge" marker-end="url(#arrL2)"/>
  <line x1="435" y1="530" x2="265" y2="560" class="edge" marker-end="url(#arrL2)"/>

  <!-- Legend bottom -->
