  <line x1="1160" y1="340" x2="1028" y2="170" class="edge" marker-end="url(#arrL2)"/>
  <text x="1100" y="260" class="lbl-i">retrieval</text>

  <!-- Core row -> Storage -->
  <line x1="150" y1="410" x2="145" y2="440" class="edge" marker-end="url(#arrL2)"/>
  <line x1="470" y1="410" x2="435" y2="440" class="edge" marker-end="url(#arrL2)"/>
  <line x1="770" y1="410" x2="725" y2="440" class="edge-aud" marker-end="url(#arrL2)"/>
  <line x1="1040" y1="410" x2="1015" y2="440" class="edge-aud" marker-end="url(#arrL2)"/>

  <!-- Data Sources -> Connectors -->
