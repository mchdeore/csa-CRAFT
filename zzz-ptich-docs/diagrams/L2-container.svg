    <line x1="330" y1="-4" x2="360" y2="-4" class="edge-aud"/>
    <text x="366" y="0" font-size="9.5">dotted edge · audit emit</text>
    <text x="520" y="0" font-size="9.5">⟨I⟩ · Python protocol seam</text>
