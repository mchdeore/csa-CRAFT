    <text x="290" y="60" class="lbl-i-c">.pre-commit-config.yaml</text>
    <text x="290" y="76" class="iface">ruff · pyright · bandit · pip-audit · detect-secrets · pytest</text>
    <text x="870" y="44" class="lbl-c" font-weight="bold">GitHub Actions</text>
    <text x="870" y="60" class="lbl-i-c">.github/workflows/ci.yml</text>
    <text x="870" y="76" class="iface">route rules · role levels · protocol contracts · 156 tests · 91% cov</text>
  </g>

  <!-- ============== EDGES ============== -->
  <!-- Actors -> RBAC band -->
  <line x1="170" y1="100" x2="188" y2="140" class="edge" marker-end="url(#arrL2)"/>
  <line x1="170" y1="140" x2="188" y2="160" class="edge" marker-end="url(#arrL2)"/>
  <line x1="170" y1="180" x2="188" y2="200" class="edge" marker-end="url(#arrL2)"/>
  <line x1="170" y1="220" x2="188" y2="220" class="edge" marker-end="url(#arrL2)"/>

