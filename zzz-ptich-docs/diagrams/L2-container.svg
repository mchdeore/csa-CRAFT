<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1000" font-family="Times New Roman, Times, serif">
  <defs>
    <marker id="arrL2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000"/>
    </marker>
    <style><![CDATA[
      .box { fill: #fff; stroke: #000; stroke-width: 1; }
      .box-dashed { fill: #fff; stroke: #000; stroke-width: 1; stroke-dasharray: 4 2; }
      .boundary { fill: none; stroke: #000; stroke-width: 1.25; }
      .lbl { font-size: 11px; fill: #000; }
      .lbl-c { font-size: 11px; fill: #000; text-anchor: middle; }
      .lbl-i { font-size: 10px; fill: #000; font-style: italic; }
      .lbl-i-c { font-size: 10px; fill: #000; font-style: italic; text-anchor: middle; }
      .head { font-size: 12px; font-weight: bold; font-variant: small-caps; letter-spacing: 1px; fill: #000; text-anchor: middle; }
      .head-l { font-size: 12px; font-weight: bold; font-variant: small-caps; letter-spacing: 1px; fill: #000; }
      .iface { font-size: 10px; font-style: italic; fill: #000; text-anchor: middle; }
      .edge { stroke: #000; stroke-width: 1; fill: none; }
      .edge-aud { stroke: #000; stroke-width: 1; fill: none; stroke-dasharray: 2 2; }
      .title { font-size: 16px; font-weight: bold; font-variant: small-caps; letter-spacing: 1.5px; fill: #000; text-anchor: middle; }
      .mono { font-family: "Courier New", Courier, monospace; font-size: 10.5px; fill: #000; }
      .mono-c { font-family: "Courier New", Courier, monospace; font-size: 10.5px; fill: #000; text-anchor: middle; }
    ]]></style>
  </defs>

  <text x="380" y="24" class="title">L2 · Containers · Actors · External Systems</text>

  <!-- ============== ACTORS as a listed example ============== -->
  <g transform="translate(20,50)">
    <rect x="0" y="0" width="720" height="60" class="box"/>
    <text x="12" y="20" class="head-l">ACTORS</text>
    <text x="12" y="40" class="lbl">• Mission Engineer   • Systems Engineer   • Program Admin   • HITL Reviewer</text>
    <text x="12" y="54" class="lbl-i">example roster — each reaches CRAFT through the public routes below</text>
  </g>

  <!-- ============== RBAC (pseudocode route + 3 role examples) ============== -->
  <g transform="translate(20,130)">
    <rect x="0" y="0" width="720" height="150" class="boundary"/>
    <text x="360" y="20" class="head">ROUTE-GATED RBAC   —   ⟨I⟩ AuthProvider</text>

    <!-- pseudocode route -->
    <rect x="20" y="36" width="360" height="100" class="box"/>
    <text x="200" y="54" class="head">ROUTE (PSEUDOCODE)</text>
    <text x="34" y="74" class="mono">@route("/path/*", role=&lt;required&gt;)</text>
    <text x="34" y="90" class="mono">def handler(req):</text>
    <text x="34" y="106" class="mono">    before_request()  # auth · ctx</text>
    <text x="34" y="122" class="mono">    after_request()   # audit emit</text>

    <!-- role examples -->
    <rect x="400" y="36" width="300" height="100" class="box"/>
    <text x="550" y="54" class="head">EXAMPLE ROLES</text>
    <text x="414" y="74"  class="mono">base   (1)  — read · chat</text>
    <text x="414" y="90"  class="mono">power  (2)  — + upload · tools</text>
    <text x="414" y="106" class="mono">admin  (3)  — + /admin/*</text>
    <text x="414" y="124" class="lbl-i">base &lt; power &lt; admin   —   _ROLE_LEVEL</text>
  </g>

  <!-- ============== PRIMARY AGENT (entry point) ============== -->
  <g transform="translate(20,300)">
    <rect x="0" y="0" width="720" height="70" class="box"/>
    <text x="360" y="20" class="head">PRIMARY AGENT — ENTRY POINT</text>
    <text x="360" y="40" class="lbl-c">LangGraph ReAct · recursion_limit=25 · HITL interrupt</text>
    <text x="360" y="58" class="iface">⟨I⟩ ChatProvider   ⟨I⟩ AgentActionLog   ⟨I⟩ Tool</text>
  </g>

  <!-- ============== TOOL REGISTRY + DATASOURCE REGISTRY (independent blocks) ============== -->
  <g transform="translate(20,390)">
    <rect x="0" y="0" width="350" height="160" class="box"/>
    <text x="175" y="20" class="head">TOOL REGISTRY   ⟨I⟩ Tool</text>
    <text x="14" y="44" class="lbl">• weather          — forecast · observation</text>
    <text x="14" y="60" class="lbl">• documents        — ingest · search · cite</text>
    <text x="14" y="76" class="lbl">• charts           — overlaid bar · radar</text>
    <text x="14" y="92" class="lbl">• query_data       — SQL · RBAC-scoped</text>
    <text x="14" y="108" class="lbl">• code_exec        — sandbox (dev flag)</text>
    <text x="14" y="124" class="lbl">• report / costing — distance · compliance</text>
    <text x="14" y="146" class="lbl-i">POST /tools/execute/&lt;name&gt;   validated · audited</text>

    <rect x="370" y="0" width="350" height="160" class="box"/>
    <text x="545" y="20" class="head">DATASOURCE REGISTRY   ⟨I⟩ DataSource</text>
    <text x="384" y="44"  class="lbl">• LocalFile      — filesystem · live</text>
    <text x="384" y="60"  class="lbl">• SharePoint     — Graph API · MSAL · dev flag</text>
    <text x="384" y="76"  class="lbl">• SAP            — REST · OData · dev flag</text>
    <text x="384" y="92"  class="lbl">• STK / MATLAB   — adapter · license · dev flag</text>
    <text x="384" y="108" class="lbl">• Vector index   — Azure AI Search · dev flag</text>
    <text x="384" y="124" class="lbl">• Auth           — MSAL · OAuth · svc acct</text>
    <text x="384" y="146" class="lbl-i">registered per request · RBAC-scoped</text>
  </g>

  <!-- ============== STORAGE ============== -->
  <g transform="translate(20,570)">
    <rect x="0" y="0" width="720" height="90" class="box"/>
    <text x="360" y="18" class="head">STORAGE   —   ⟨I⟩ WorkspaceStore</text>
    <line x1="240" y1="26" x2="240" y2="86" stroke="#000" stroke-width="0.5" stroke-dasharray="2 2"/>
    <line x1="480" y1="26" x2="480" y2="86" stroke="#000" stroke-width="0.5" stroke-dasharray="2 2"/>
    <text x="120" y="44" class="lbl-c" font-weight="bold">Workspace Store</text>
    <text x="120" y="60" class="lbl-i-c">session · scratch</text>
    <text x="120" y="76" class="iface">SqliteStore + ScratchStore</text>
    <text x="360" y="44" class="lbl-c" font-weight="bold">Data Store (RBAC)</text>
    <text x="360" y="60" class="lbl-i-c">per-user query scope</text>
    <text x="360" y="76" class="iface">SqliteDataStore</text>
    <text x="600" y="44" class="lbl-c" font-weight="bold">Audit Log</text>
    <text x="600" y="60" class="lbl-i-c">JSONL · 90-day · append-only</text>
    <text x="600" y="76" class="iface">→ Log Analytics (dev flag)</text>
  </g>

  <!-- ============== EXTERNAL SYSTEMS (list) ============== -->
  <g transform="translate(20,680)">
    <rect x="0" y="0" width="720" height="90" class="box"/>
    <text x="360" y="18" class="head">EXTERNAL SYSTEMS</text>
    <text x="14" y="40" class="lbl">• Azure OpenAI  (gpt-4o)      — LLM inference</text>
    <text x="14" y="56" class="lbl">• Azure AI Search  (dev flag)  — hybrid retrieval + citations</text>
    <text x="14" y="72" class="lbl">• Entra ID  (dev flag)         — identity · MSAL</text>
    <text x="374" y="40" class="lbl">• Content Safety  (dev flag)   — guardrails</text>
    <text x="374" y="56" class="lbl">• APIM · App Gateway (dev flag) — edge · WAF · rate limit</text>
    <text x="374" y="72" class="lbl">• Log Analytics  (dev flag)    — immutable audit sink</text>
  </g>

  <!-- ============== TEST SURFACE (one line) ============== -->
  <g transform="translate(20,790)">
    <rect x="0" y="0" width="720" height="56" class="box"/>
    <text x="360" y="20" class="head">TEST SURFACE</text>
    <text x="360" y="40" class="lbl-c">ruff · pyright · pytest · bandit · pip-audit · detect-secrets — pre-commit + CI</text>
  </g>

  <!-- ============== EDGES ============== -->
  <!-- Actors -> RBAC -->
  <line x1="380" y1="110" x2="380" y2="128" class="edge" marker-end="url(#arrL2)"/>
  <!-- RBAC -> Primary Agent -->
  <line x1="380" y1="280" x2="380" y2="298" class="edge" marker-end="url(#arrL2)"/>
  <!-- Primary Agent -> Tool + DataSource -->
  <line x1="380" y1="370" x2="175" y2="388" class="edge" marker-end="url(#arrL2)"/>
  <line x1="380" y1="370" x2="545" y2="388" class="edge" marker-end="url(#arrL2)"/>
  <!-- registries -> storage -->
  <line x1="175" y1="550" x2="200" y2="568" class="edge" marker-end="url(#arrL2)"/>
  <line x1="545" y1="550" x2="520" y2="568" class="edge" marker-end="url(#arrL2)"/>
  <!-- storage audit -> external log analytics -->
  <path d="M 660 660 L 660 678" class="edge-aud" marker-end="url(#arrL2)"/>

  <!-- Legend -->
  <g transform="translate(20,870)">
    <rect x="0" y="-10" width="18" height="12" class="box"/>
    <text x="24" y="0" class="lbl">solid · live</text>
    <rect x="130" y="-10" width="18" height="12" class="box-dashed"/>
    <text x="154" y="0" class="lbl">dashed · dev flag (external dependency)</text>
    <text x="430" y="0" class="lbl">⟨I⟩ · Python protocol seam</text>
  </g>
</svg>
