<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="Times New Roman, Times, serif">
  <defs>
    <marker id="arrL1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000"/>
    </marker>
    <style><![CDATA[
      .box { fill: #fff; stroke: #000; stroke-width: 1; }
      .box-dashed { fill: #fff; stroke: #000; stroke-width: 1; stroke-dasharray: 4 2; }
      .boundary { fill: none; stroke: #000; stroke-width: 1.25; }
      .label { font-size: 11px; fill: #000; text-anchor: middle; }
      .label-small { font-size: 9px; fill: #000; text-anchor: middle; font-style: italic; }
      .group-head { font-size: 11px; font-weight: bold; font-variant: small-caps; letter-spacing: 0.8px; fill: #000; text-anchor: middle; }
      .edge { stroke: #000; stroke-width: 1; fill: none; }
      .title { font-size: 15px; font-weight: bold; font-variant: small-caps; letter-spacing: 1.5px; fill: #000; text-anchor: middle; }
    ]]></style>
  </defs>

  <text x="500" y="22" class="title">L1 · CRAFT System Context</text>

  <!-- ======= ACTORS (left) ======= -->
  <g transform="translate(0,60)">
    <text x="90" y="0" class="group-head">ACTORS</text>
    <rect x="20" y="20" width="140" height="40" class="box"/>
    <text x="90" y="40" class="label">Mission Engineer</text>
    <text x="90" y="54" class="label-small">corpus · HITL submit</text>

    <rect x="20" y="80" width="140" height="40" class="box"/>
    <text x="90" y="100" class="label">Systems Engineer</text>
    <text x="90" y="114" class="label-small">risk · retrieval</text>

    <rect x="20" y="140" width="140" height="40" class="box"/>
    <text x="90" y="160" class="label">Program Admin</text>
    <text x="90" y="174" class="label-small">cost · forecast</text>

    <rect x="20" y="200" width="140" height="40" class="box"/>
    <text x="90" y="220" class="label">HITL Reviewer</text>
    <text x="90" y="234" class="label-small">approve · reject</text>
  </g>

  <!-- ======= CRAFT BOUNDARY (center) ======= -->
  <g transform="translate(0,0)">
    <rect x="220" y="90" width="260" height="300" class="boundary"/>
    <text x="350" y="112" class="group-head">CRAFT</text>
    <text x="350" y="126" class="label-small">Flask + Dash edge</text>

    <rect x="250" y="150" width="200" height="36" class="box"/>
    <text x="350" y="169" class="label">/chat/send   [base]</text>

    <rect x="250" y="196" width="200" height="36" class="box"/>
    <text x="350" y="215" class="label">/uploads     [power]</text>

    <rect x="250" y="242" width="200" height="36" class="box"/>
    <text x="350" y="261" class="label">/admin/*     [admin]</text>

    <rect x="250" y="300" width="200" height="52" class="box"/>
    <text x="350" y="320" class="label">Primary Agent · Tools</text>
    <text x="350" y="336" class="label-small">audit envelope · HITL</text>
    <text x="350" y="348" class="label-small">RBAC + trace id</text>
  </g>

  <!-- ======= CONTROL PLANES (right, 4 stacked groups) ======= -->
  <g transform="translate(540,60)">
    <!-- LLM & AI -->
    <text x="200" y="0" class="group-head">LLM &amp; AI</text>
    <rect x="20" y="10" width="360" height="92" class="boundary"/>
    <rect x="30" y="22" width="160" height="30" class="box"/>
    <text x="110" y="41" class="label">Azure OpenAI</text>
    <rect x="200" y="22" width="170" height="30" class="box-dashed"/>
    <text x="285" y="41" class="label">Azure AI Search</text>
    <rect x="30" y="60" width="160" height="30" class="box-dashed"/>
    <text x="110" y="79" class="label">Content Safety</text>
    <rect x="200" y="60" width="170" height="30" class="box-dashed"/>
    <text x="285" y="79" class="label">Model routing / APIM</text>

    <!-- Data Sources -->
    <text x="200" y="128" class="group-head">DATA SOURCES</text>
    <rect x="20" y="138" width="360" height="92" class="boundary"/>
    <rect x="30" y="150" width="160" height="30" class="box"/>
    <text x="110" y="169" class="label">Local filesystem</text>
    <rect x="200" y="150" width="170" height="30" class="box-dashed"/>
    <text x="285" y="169" class="label">SharePoint</text>
    <rect x="30" y="188" width="160" height="30" class="box-dashed"/>
    <text x="110" y="207" class="label">SAP</text>
    <rect x="200" y="188" width="170" height="30" class="box-dashed"/>
    <text x="285" y="207" class="label">STK / MATLAB</text>

    <!-- Identity & Edge -->
    <text x="200" y="256" class="group-head">IDENTITY &amp; EDGE</text>
    <rect x="20" y="266" width="360" height="66" class="boundary"/>
    <rect x="30" y="278" width="160" height="30" class="box-dashed"/>
    <text x="110" y="297" class="label">Entra ID</text>
    <rect x="200" y="278" width="170" height="30" class="box-dashed"/>
    <text x="285" y="297" class="label">APIM · App Gateway</text>

    <!-- Ops & Audit -->
    <text x="200" y="358" class="group-head">OPS &amp; AUDIT</text>
    <rect x="20" y="368" width="360" height="92" class="boundary"/>
    <rect x="30" y="380" width="160" height="30" class="box-dashed"/>
    <text x="110" y="399" class="label">Log Analytics</text>
    <rect x="200" y="380" width="170" height="30" class="box-dashed"/>
    <text x="285" y="399" class="label">App Service · PBMM</text>
    <rect x="30" y="418" width="160" height="30" class="box-dashed"/>
    <text x="110" y="437" class="label">SSC LaunchPad</text>
    <rect x="200" y="418" width="170" height="30" class="box-dashed"/>
    <text x="285" y="437" class="label">Container Apps</text>
  </g>

  <!-- Actor edges -->
  <line x1="160" y1="80"  x2="248" y2="167" class="edge" marker-end="url(#arrL1)"/>
  <line x1="160" y1="140" x2="248" y2="213" class="edge" marker-end="url(#arrL1)"/>
  <line x1="160" y1="200" x2="248" y2="213" class="edge" marker-end="url(#arrL1)"/>
  <line x1="160" y1="260" x2="248" y2="259" class="edge" marker-end="url(#arrL1)"/>

  <!-- CRAFT -> control plane edges (single trunk per plane) -->
  <line x1="482" y1="326" x2="558" y2="106" class="edge" marker-end="url(#arrL1)"/>
  <line x1="482" y1="326" x2="558" y2="234" class="edge" marker-end="url(#arrL1)"/>
  <line x1="482" y1="326" x2="558" y2="334" class="edge" marker-end="url(#arrL1)"/>
  <line x1="482" y1="326" x2="558" y2="436" class="edge" marker-end="url(#arrL1)"/>

  <!-- Legend -->
  <g transform="translate(40,560)">
    <text x="0" y="0" font-size="10" font-weight="bold" font-variant="small-caps" letter-spacing="0.6px">LEGEND</text>
    <rect x="60" y="-10" width="18" height="12" class="box"/>
    <text x="84" y="0" font-size="10">solid · live service</text>
    <rect x="230" y="-10" width="18" height="12" class="box-dashed"/>
    <text x="254" y="0" font-size="10">dashed · dev flag (external dependency)</text>
    <text x="520" y="0" font-size="10">bracketed role · RBAC level</text>
  </g>
</svg>
