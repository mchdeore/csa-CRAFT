<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrUC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000"/>
    </marker>
    <style><![CDATA[
      .lane { fill: #fff; stroke: #000; stroke-width: 0.9; }
      .div  { stroke: #000; stroke-width: 0.4; stroke-dasharray: 2 2; }
      .box  { fill: #fff; stroke: #000; stroke-width: 0.9; }
      .gate { fill: #fff; stroke: #000; stroke-width: 1; }
      .term { fill: #000; stroke: #000; stroke-width: 1; }
      .lbl  { font-size: 10.5px; fill: #000; text-anchor: middle; }
      .lbl-s{ font-size: 9px; fill: #000; text-anchor: middle; font-style: italic; }
      .h    { font-size: 12px; font-weight: 700; fill: #000; }
      .sub  { font-size: 10px; fill: #000; font-style: italic; }
      .foot { font-size: 10px; fill: #000; text-anchor: middle; font-style: italic; }
      .edge { stroke: #000; stroke-width: 0.9; fill: none; }
      .swim { font-size: 9.5px; font-weight: 600; fill: #000; text-anchor: middle; }
      .title { font-size: 13px; font-weight: 600; fill: #000; text-anchor: middle; }
    ]]></style>
  </defs>

  <text x="380" y="18" class="title">Figure 3 · Generic Use-Case Lane</text>

  <!-- Swim lane header -->
  <g transform="translate(0,34)">
    <text x="90"  y="10" class="swim">USER</text>
    <text x="240" y="10" class="swim">AGENT</text>
    <text x="470" y="10" class="swim">SERVICES</text>
    <text x="680" y="10" class="swim">TERMINAL</text>
    <line x1="30" y1="14" x2="730" y2="14" class="div"/>
  </g>

  <!-- ===== GENERIC LANE ===== -->
  <g transform="translate(0,56)">
    <rect x="30" y="0" width="700" height="200" class="lane"/>
    <text x="40" y="20" class="h">Use-Case Pattern</text>
    <text x="40" y="36" class="sub">one shape fits every case — the Tool, DataSource, and HITL steps are swapped for the mission</text>

    <line x1="160" y1="46" x2="160" y2="200" class="div"/>
    <line x1="340" y1="46" x2="340" y2="200" class="div"/>
    <line x1="590" y1="46" x2="590" y2="200" class="div"/>

    <!-- USER -->
    <rect x="48" y="94" width="100" height="36" class="box"/>
    <text x="98" y="112" class="lbl">Caller</text>
    <text x="98" y="124" class="lbl-s">human or external</text>

    <!-- AUTH gate -->
    <polygon points="178,112 196,96 258,96 276,112 258,128 196,128" class="gate"/>
    <text x="227" y="115" class="lbl">Auth</text>
    <text x="227" y="126" class="lbl-s">role · trace</text>

    <!-- AGENT -->
    <rect x="286" y="94" width="48" height="36" class="box"/>
    <text x="310" y="112" class="lbl">Agent</text>
    <text x="310" y="124" class="lbl-s">ReAct</text>

    <!-- DataSource retrieve -->
    <rect x="352" y="94" width="110" height="36" class="box"/>
    <text x="407" y="112" class="lbl">DataSource</text>
    <text x="407" y="124" class="lbl-s">retrieve</text>

    <!-- Tool (process) -->
    <rect x="470" y="94" width="110" height="36" class="box"/>
    <text x="525" y="112" class="lbl">Tool</text>
    <text x="525" y="124" class="lbl-s">process · plan</text>

    <!-- HITL gate (optional, below services) -->
    <polygon points="398,158 420,142 500,142 522,158 500,174 420,174" class="gate"/>
    <text x="460" y="160" class="lbl">HITL</text>
    <text x="460" y="172" class="lbl-s">if risky</text>

    <!-- DataSource write (optional, below HITL) -->
    <rect x="400" y="182" width="120" height="18" class="box"/>
    <text x="460" y="195" class="lbl">DataSource write</text>

    <!-- Terminal -->
    <circle cx="650" cy="112" r="12" class="term"/>
    <text x="650" y="116" class="lbl" fill="#fff">●</text>
    <text x="650" y="140" class="lbl-s">audit · end</text>

    <!-- edges -->
    <line x1="148" y1="112" x2="176" y2="112" class="edge" marker-end="url(#arrUC)"/>
    <line x1="276" y1="112" x2="284" y2="112" class="edge" marker-end="url(#arrUC)"/>
    <line x1="334" y1="112" x2="350" y2="112" class="edge" marker-end="url(#arrUC)"/>
    <line x1="462" y1="112" x2="468" y2="112" class="edge" marker-end="url(#arrUC)"/>
    <line x1="580" y1="112" x2="636" y2="112" class="edge" marker-end="url(#arrUC)"/>
    <path d="M 525 130 L 525 142" class="edge" marker-end="url(#arrUC)"/>
    <path d="M 460 174 L 460 182" class="edge" marker-end="url(#arrUC)"/>
  </g>

  <text x="380" y="286" class="foot">Role check · AgentAction audit · HITL interrupt stay fixed; the Tool + DataSource behind each block are swapped per use case.</text>
</svg>
