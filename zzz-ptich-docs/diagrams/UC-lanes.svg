<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" font-family="Times New Roman, Times, serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000"/>
    </marker>
    <style><![CDATA[
      .lane-bg { fill: #ffffff; stroke: #000; stroke-width: 0.75; }
      .lane-title { font-size: 12px; font-weight: bold; font-variant: small-caps; letter-spacing: 1px; fill: #000; }
      .uc-id { font-size: 11px; font-weight: bold; font-variant: small-caps; letter-spacing: 0.8px; fill: #000; }
      .lane-divider { stroke: #000; stroke-width: 0.5; stroke-dasharray: 2 2; }
      .node { fill: #fff; stroke: #000; stroke-width: 1; }
      .node-dashed { fill: #fff; stroke: #000; stroke-width: 1; stroke-dasharray: 4 2; }
      .gate { fill: #fff; stroke: #000; stroke-width: 1.2; }
      .terminal { fill: #000; stroke: #000; stroke-width: 1; }
      .label { font-size: 10px; fill: #000; text-anchor: middle; }
      .label-small { font-size: 8.5px; fill: #000; text-anchor: middle; font-style: italic; }
      .req { font-size: 8px; fill: #000; text-anchor: middle; font-style: italic; }
      .edge { stroke: #000; stroke-width: 1; fill: none; }
      .edge-dashed { stroke: #000; stroke-width: 1; fill: none; stroke-dasharray: 4 2; }
      .swim-head { font-size: 9px; font-weight: bold; font-variant: small-caps; letter-spacing: 0.6px; fill: #000; text-anchor: middle; }
      .title { font-size: 15px; font-weight: bold; font-variant: small-caps; letter-spacing: 1.5px; fill: #000; text-anchor: middle; }
    ]]></style>
  </defs>

  <text x="550" y="22" class="title">Use-Case Lanes · E2 · F1 · F4</text>

  <!-- Swim lane header row -->
  <g transform="translate(0,40)">
    <text x="90"  y="12" class="swim-head">USER</text>
    <text x="300" y="12" class="swim-head">AGENT</text>
    <text x="620" y="12" class="swim-head">SERVICES</text>
    <text x="930" y="12" class="swim-head">TERMINAL</text>
    <line x1="40"  y1="18" x2="1060" y2="18" class="lane-divider"/>
  </g>

  <!-- =================== LANE 1 : UC-E2 =================== -->
  <g transform="translate(0,70)">
    <rect x="40" y="0" width="1020" height="200" class="lane-bg"/>
    <text x="52" y="22" class="lane-title">UC-E2 · Risk ID + HITL</text>
    <text x="52" y="38" class="uc-id">Engineering · CADRe Part A</text>

    <!-- Vertical swim dividers -->
    <line x1="180" y1="50" x2="180" y2="200" class="lane-divider"/>
    <line x1="440" y1="50" x2="440" y2="200" class="lane-divider"/>
    <line x1="820" y1="50" x2="820" y2="200" class="lane-divider"/>

    <!-- User lane -->
    <rect x="60" y="110" width="110" height="36" class="node"/>
    <text x="115" y="128" class="label">Engineer</text>
    <text x="115" y="140" class="label-small">upload Part A</text>

    <!-- Agent lane -->
    <polygon points="200,128 220,112 300,112 320,128 300,144 220,144" class="gate"/>
    <text x="260" y="131" class="label">Auth gate</text>
    <text x="260" y="142" class="label-small">RBAC · trace id</text>

    <rect x="340" y="110" width="90" height="36" class="node"/>
    <text x="385" y="128" class="label">Primary</text>
    <text x="385" y="140" class="label-small">Agent (ReAct)</text>

    <!-- Services lane -->
    <rect x="460" y="110" width="100" height="36" class="node-dashed"/>
    <text x="510" y="128" class="label">Hybrid retr.</text>
    <text x="510" y="140" class="req">UMR-002…006</text>

    <rect x="580" y="110" width="100" height="36" class="node-dashed"/>
    <text x="630" y="128" class="label">Classifier</text>
    <text x="630" y="140" class="req">UMR-036…040</text>

    <polygon points="700,128 720,112 800,112 820,128 800,144 720,144" class="gate"/>
    <text x="760" y="131" class="label">HITL gate</text>
    <text x="760" y="142" class="req">HITL-001</text>

    <!-- Branch below HITL to secondary -->
    <rect x="580" y="162" width="100" height="30" class="node-dashed"/>
    <text x="630" y="180" class="label">Risk register</text>

    <!-- Terminal lane -->
    <circle cx="900" cy="128" r="14" class="terminal"/>
    <text x="900" y="131" class="label" fill="#fff">●</text>
    <text x="900" y="156" class="label-small">audit · end</text>

    <!-- Edges -->
    <line x1="170" y1="128" x2="198" y2="128" class="edge" marker-end="url(#arrow)"/>
    <line x1="322" y1="128" x2="338" y2="128" class="edge" marker-end="url(#arrow)"/>
    <line x1="432" y1="128" x2="458" y2="128" class="edge" marker-end="url(#arrow)"/>
    <line x1="562" y1="128" x2="578" y2="128" class="edge-dashed" marker-end="url(#arrow)"/>
    <line x1="682" y1="128" x2="698" y2="128" class="edge-dashed" marker-end="url(#arrow)"/>
    <path d="M 760 146 L 760 177 L 682 177" class="edge-dashed" marker-end="url(#arrow)"/>
    <path d="M 580 177 L 500 177 L 500 200" class="edge-dashed"/>
    <line x1="822" y1="128" x2="884" y2="128" class="edge" marker-end="url(#arrow)"/>
  </g>

  <!-- =================== LANE 2 : UC-F1 =================== -->
  <g transform="translate(0,290)">
    <rect x="40" y="0" width="1020" height="200" class="lane-bg"/>
    <text x="52" y="22" class="lane-title">UC-F1 · Parametric Cost + HITL</text>
    <text x="52" y="38" class="uc-id">Finance · Mission estimate</text>

    <line x1="180" y1="50" x2="180" y2="200" class="lane-divider"/>
    <line x1="440" y1="50" x2="440" y2="200" class="lane-divider"/>
    <line x1="820" y1="50" x2="820" y2="200" class="lane-divider"/>

    <rect x="60" y="110" width="110" height="36" class="node"/>
    <text x="115" y="128" class="label">Admin</text>
    <text x="115" y="140" class="label-small">request estimate</text>

    <polygon points="200,128 220,112 300,112 320,128 300,144 220,144" class="gate"/>
    <text x="260" y="131" class="label">Auth gate</text>
    <text x="260" y="142" class="label-small">RBAC · trace id</text>

    <rect x="340" y="110" width="90" height="36" class="node"/>
    <text x="385" y="128" class="label">Primary</text>
    <text x="385" y="140" class="label-small">Agent (ReAct)</text>

    <rect x="460" y="110" width="100" height="36" class="node-dashed"/>
    <text x="510" y="128" class="label">Hist. retr.</text>
    <text x="510" y="140" class="req">UMR-031</text>

    <rect x="580" y="110" width="100" height="36" class="node"/>
    <text x="630" y="128" class="label">Cost agg.</text>
    <text x="630" y="140" class="req">UMR-032…034</text>

    <polygon points="700,128 720,112 800,112 820,128 800,144 720,144" class="gate"/>
    <text x="760" y="131" class="label">HITL gate</text>
    <text x="760" y="142" class="req">UMR-035</text>

    <rect x="580" y="162" width="100" height="30" class="node-dashed"/>
    <text x="630" y="180" class="label">Commitment</text>

    <circle cx="900" cy="128" r="14" class="terminal"/>
    <text x="900" y="131" class="label" fill="#fff">●</text>
    <text x="900" y="156" class="label-small">audit · end</text>

    <line x1="170" y1="128" x2="198" y2="128" class="edge" marker-end="url(#arrow)"/>
    <line x1="322" y1="128" x2="338" y2="128" class="edge" marker-end="url(#arrow)"/>
    <line x1="432" y1="128" x2="458" y2="128" class="edge" marker-end="url(#arrow)"/>
    <line x1="562" y1="128" x2="578" y2="128" class="edge-dashed" marker-end="url(#arrow)"/>
    <line x1="682" y1="128" x2="698" y2="128" class="edge" marker-end="url(#arrow)"/>
    <path d="M 760 146 L 760 177 L 682 177" class="edge-dashed" marker-end="url(#arrow)"/>
    <path d="M 580 177 L 500 177 L 500 200" class="edge-dashed"/>
    <line x1="822" y1="128" x2="884" y2="128" class="edge" marker-end="url(#arrow)"/>
  </g>

  <!-- =================== LANE 3 : UC-F4 =================== -->
  <g transform="translate(0,510)">
    <rect x="40" y="0" width="1020" height="200" class="lane-bg"/>
    <text x="52" y="22" class="lane-title">UC-F4 · Vendor Cost · SAP</text>
    <text x="52" y="38" class="uc-id">Finance · Vendor extract</text>

    <line x1="180" y1="50" x2="180" y2="200" class="lane-divider"/>
    <line x1="440" y1="50" x2="440" y2="200" class="lane-divider"/>
    <line x1="820" y1="50" x2="820" y2="200" class="lane-divider"/>

    <rect x="60" y="110" width="110" height="36" class="node"/>
    <text x="115" y="128" class="label">Analyst</text>
    <text x="115" y="140" class="label-small">vendor cost query</text>

    <polygon points="200,128 220,112 300,112 320,128 300,144 220,144" class="gate"/>
    <text x="260" y="131" class="label">Auth gate</text>
    <text x="260" y="142" class="label-small">RBAC · trace id</text>

    <rect x="340" y="110" width="90" height="36" class="node"/>
    <text x="385" y="128" class="label">Primary</text>
    <text x="385" y="140" class="label-small">Agent (ReAct)</text>

    <rect x="460" y="110" width="100" height="36" class="node-dashed"/>
    <text x="510" y="128" class="label">SAP conn.</text>
    <text x="510" y="140" class="req">UMR-053…055</text>

    <rect x="580" y="110" width="100" height="36" class="node"/>
    <text x="630" y="128" class="label">Vendor extr.</text>
    <text x="630" y="140" class="label-small">parse · join</text>

    <rect x="700" y="110" width="120" height="36" class="node"/>
    <text x="760" y="128" class="label">Aggregate</text>
    <text x="760" y="140" class="label-small">cost rollup</text>

    <circle cx="900" cy="128" r="14" class="terminal"/>
    <text x="900" y="131" class="label" fill="#fff">●</text>
    <text x="900" y="156" class="label-small">audit · end</text>

    <line x1="170" y1="128" x2="198" y2="128" class="edge" marker-end="url(#arrow)"/>
    <line x1="322" y1="128" x2="338" y2="128" class="edge" marker-end="url(#arrow)"/>
    <line x1="432" y1="128" x2="458" y2="128" class="edge" marker-end="url(#arrow)"/>
    <line x1="562" y1="128" x2="578" y2="128" class="edge-dashed" marker-end="url(#arrow)"/>
    <line x1="682" y1="128" x2="698" y2="128" class="edge" marker-end="url(#arrow)"/>
    <line x1="822" y1="128" x2="884" y2="128" class="edge" marker-end="url(#arrow)"/>
  </g>

  <!-- Legend -->
  <g transform="translate(40,730)">
    <rect x="0" y="-10" width="18" height="12" class="node"/>
    <text x="24" y="0" font-size="9">solid · in-flow service</text>
    <rect x="170" y="-10" width="18" height="12" class="node-dashed"/>
    <text x="194" y="0" font-size="9">dashed · external dep (dev flag)</text>
    <polygon points="380,-10 390,-16 420,-16 430,-10 420,-4 390,-4" class="gate"/>
    <text x="438" y="0" font-size="9">hex · gate (auth / HITL)</text>
    <circle cx="575" cy="-5" r="7" class="terminal"/>
    <text x="588" y="0" font-size="9">● · audited terminal</text>
  </g>
</svg>
